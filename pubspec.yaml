name: miead
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.2

dependencies:
  adhan: ^2.0.0+1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.1
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  intl: ^0.20.3
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  sqflite: ^2.4.4
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.16.1
  freezed: ^4.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/prayer/
    - assets/images/study/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#006A4E"
  adaptive_icon_foreground: "assets/images/logo.png"
